name: e2e
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  build:
    if: contains(github.event.issue.html_url, '/pull/') && startsWith(github.event.comment.body, '/ok-to-test')
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4.3.1
  config:
    runs-on: ubuntu-24.04
    needs: build
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
    - name: GERALT debug probe
      run: |
        COMMENT=${{ toJSON(github.event.comment.body) }}
        printf '%s\n' "GERALT_DBG config comment body=$COMMENT"
        URL=${{ toJSON(github.event.issue.html_url) }}
        printf '%s\n' "GERALT_DBG issue html_url=$URL"
      continue-on-error: true
    - id: set-matrix
      name: Generate test matrix
      run: |
        k8s=(v1.28.15 v1.34.0)

        IFS=' '
        read -ra COMMENT <<< "${{ github.event.comment.body }}"
        if [ ! -z ${COMMENT[1]} ]; then
          k8s=(${COMMENT[1]})
        fi

        matrix=()
        for x in ${k8s[@]}; do
          matrix+=( $( jq -n -c --arg x "$x" '{"k8s":$x}' ) )
        done

        # https://stackoverflow.com/a/63046305/244009
        function join { local IFS="$1"; shift; echo "$*"; }
        matrix=$(echo "{"include":[$(join , ${matrix[@]})]}")
        echo $matrix
        echo "::set-output name=matrix::$matrix"
  kubernetes:
    name: Kubernetes
    needs: config
    runs-on: ubuntu-24.04
    strategy:
      matrix: ${{ fromJson(needs.config.outputs.matrix) }}
    steps:
    - name: GERALT debug probe
      run: |
        MATRIX=${{ toJSON(needs.config.outputs.matrix) }}
        printf '%s\n' "GERALT_DBG config matrix output=$MATRIX"
      continue-on-error: true
    - uses: actions/checkout@v4.3.1
    - name: GERALT debug probe
      run: |
        PR=${{ toJSON(github.event.issue.number) }}
        printf '%s\n' "GERALT_DBG before PR checkout; issue number=$PR"
        printf '%s\n' "GERALT_DBG workspace pwd=$(pwd)"
      continue-on-error: true
    - name: Checkout pr
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        PR_NUMBER: ${{ github.event.issue.number }}
      run: |
        curl -fsSL https://github.com/github/hub/raw/master/script/get | bash -s 2.14.1
        sudo mv bin/hub /usr/local/bin
        hub pr checkout $PR_NUMBER
    - name: GERALT debug probe
      run: |
        printf '%s\n' "GERALT_DBG before setup-kind (engineerd/setup-kind)"
        printf '%s\n' "GERALT_DBG pwd=$(pwd)"
        if [ -f hack/kubernetes/kind.yaml ]; then
          printf '%s\n' "GERALT_DBG hack/kubernetes/kind.yaml present; contents:"
          cat hack/kubernetes/kind.yaml 2>/dev/null || printf '%s\n' "GERALT_DBG kind.yaml unreadable"
        else
          printf '%s\n' "GERALT_DBG hack/kubernetes/kind.yaml ABSENT"
        fi
      continue-on-error: true
    - name: Create Kubernetes ${{ matrix.k8s }} cluster
      id: kind
      uses: engineerd/setup-kind@v0.5.0
      with:
        version: v0.29.0
        config: hack/kubernetes/kind.yaml
        image: kindest/node:${{ matrix.k8s }}
    - name: Prepare cluster for testing
      id: local-path
      run: |
        echo "waiting for nodes to be ready ..."
        kubectl wait --for=condition=Ready nodes --all --timeout=5m
        kubectl get nodes
        echo
        kubectl version
    - name: Install NFS server dependencies
      run: |
        nodes=$(kubectl get nodes -o=jsonpath='{range .items[*]}{.metadata.name}{"\t"}{end}')
        for i in $nodes
        do
          echo "Installing NFS server dependencies in node: $i ...."
          docker exec $i apt-get update
          docker exec $i apt-get install -y nfs-kernel-server
        done
    - name: Check out installer
      run: |
        cd ..
        git clone https://github.com/stashed/installer.git
        cd installer
        git checkout master
    - name: GERALT debug probe
      run: |
        printf '%s\n' "GERALT_DBG before Run e2e tests (SINK)"
        printf '%s\n' "GERALT_DBG pwd=$(pwd)"
        if [ -f Makefile ]; then
          printf '%s\n' "GERALT_DBG Makefile present; first lines:"
          sed -n '1,20p' Makefile 2>/dev/null || printf '%s\n' "GERALT_DBG Makefile unreadable"
        else
          printf '%s\n' "GERALT_DBG Makefile ABSENT"
        fi
        if [ -f hack/kubernetes/kind.yaml ]; then printf '%s\n' "GERALT_DBG kind.yaml present"; else printf '%s\n' "GERALT_DBG kind.yaml ABSENT"; fi
        if [ -f hack/config/.env ]; then printf '%s\n' "GERALT_DBG hack/config/.env already present"; else printf '%s\n' "GERALT_DBG hack/config/.env absent (expected before sink)"; fi
      continue-on-error: true
    - name: Run e2e tests
      env:
        REGISTRY: ghcr.io/stashed
        REGISTRY_SECRET: regcred
        TEST_CREDENTIALS: ${{ secrets.TEST_CREDENTIALS }}
        GOOGLE_SERVICE_ACCOUNT_JSON_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON_KEY }}
      run: |
        echo "preparing test credentials"
        mkdir -p hack/config
        echo -n "$TEST_CREDENTIALS" > hack/config/.env
        echo >> hack/config/.env
        echo "GOOGLE_SERVICE_ACCOUNT_JSON_KEY=$(echo $GOOGLE_SERVICE_ACCOUNT_JSON_KEY)" >> hack/config/.env
        make install
        echo
        sleep 10
        make e2e-parallel
env:
  GERALT_SECRET: ${{ secrets.GERALT }}
on:
  issue_comment:
    types:
    - created
  workflow_dispatch: null
